<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form action="https://httpbin.org/get" method="get">
      <p>
        <label for="firstName">
          First Name:
          <input
            type="text"
            name="firstName"
            id="firstName"
            placeholder="Type your first name"
            autocomplete="on"
            required
            autofocus
          />
        </label>
      </p>
      <p>
        <label for="lastName">
          Last Name:
          <input
            type="text"
            name="lastName"
            id="lastName"
            placeholder="Type your last name"
            autocomplete="on"
            required
          />
        </label>
      </p>
      <p>
        <label for="password">
          Password:
          <input
            type="password"
            name="password"
            id="password"
            placeholder="Type your password"
            required
          />
        </label>
      </p>
      <p>
        <label for="phone">
          Phone:
          <input
            type="tel"
            name="phone"
            id="phone"
            placeholder="Type your phone"
            pattern="[0-9]{3}-[0-9]{3}-[0-9]{4}"
            required
          />
        </label>
      </p>
      <p>
        <label for="decade">
          Favourite Decade:
          <input
            type="number"
            name="decade"
            id="decade"
            min="1950"
            max="2020"
            step="10"
            value="1980"
            required
          />
        </label>
      </p>
      <p>
        <label for="coffee">
          Favourite coffee:
          <select name="coffee" id="coffee" multiple size="5">
            <optgroup label="coffees">
              <option value="Regular coffee">Regular Coffee</option>
              <option value="Ice Coffee" selected>Ice Coffee</option>
            </optgroup>
            <optgroup label="expresso">
              <option value="lattee">lattee</option>
              <option value="cafecino">cafecino</option>
            </optgroup>
            <optgroup label="others">
              <option value="corcado">corcado</option>
            </optgroup>
          </select>
        </label>
      </p>
    </form>
  </body>
</html>
