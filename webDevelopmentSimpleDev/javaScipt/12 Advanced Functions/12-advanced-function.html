<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advanced HTML</title>
  </head>
  <body>
    <button onclick="" class="js-button">Click</button>

    <script>
      const buttonElement = document.querySelector(".js-button");

      buttonElement.addEventListener("click", () => {
        console.log("click");
      });

      const eventListener = () => {
        console.log("click2");
      };
      buttonElement.addEventListener("click", eventListener());

      buttonElement.removeEventListener("click", eventListener());

      // functions are values
      const function1 = function greeting() {
        console.log("hello world");
      };
      console.log(function1);

      const object1 = {
        num: 2,
        fun: function () {
          console.log("hlw world");
        },
      };
      object1.fun();

      function display(param) {
        console.log(param);
      }
      display("hi");

      // passing function as parameter
      function run(param) {
        param();
      }
      run(function () {
        console.log("function as param");
      });

      // asynchronous code
      setTimeout(function () {
        console.log("timeout");
      }, 3000); // after 5000ms run the function
      console.log("after function called");

      setInterval(function () {
        console.log("interval");
      }, 3000); // call the function in every 3s

      // for each loop
      ["make dinner", "make dishes", "watch youtube"].forEach(
        (value, index) => {
          console.log(`${value} at index ${index}`);
        },
      );

      // regular functions
      const regularFunction = function () {
        console.log("regular function");
      };

      // arrow function
      const arrowFunction = () => {
        console.log("arrow Function");
      };
      arrowFunction();

      // some features of arrow function
      // 1. if arrow function has single paramater then round brackte ar optional
      const oneParam = (param) => {
        // vs code auto formatting it -_-

        console.log(param + 1);
      };
      oneParam(5);

      // if arrow function body is only one line, then we can remove {}
      const oneLine = (a) => 2 + a; // auto return
      console.log(oneLine(1));

      const object2 = {
        method1() {},
        method2: () => {},
      };

      /*
        .filter()
        1. create a new array []
        2. return true, put value in array
        3. return false, not pull value in array
      */
      console.log(
        [1, -3, 5].filter((value, index) => {
          return true;
        }),
      );

      // so here we can remove the negative numbers from the array as
      console.log(
        [1, -3, 5].filter((value, index) => {
          // if (value >= 0) return true;
          // return false;

          // shortcut
          return value >= 0;
        }),
      );

      /*
        .map()
        1. create a new array[]
        2. whatever we return added to new array
      */
      console.log(
        [1, 1, 3].map((value, index) => {
          return value * 2;
        }),
      );

      // shortcut of arrow functions
      console.log([1, 1, 3].map((value) => value * 2));

      // closure of function
      // if a function has access to a value
      // it will always have access to that value
      
    </script>
  </body>
</html>
